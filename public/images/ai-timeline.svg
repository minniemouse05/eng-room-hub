<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6" />
      <stop offset="20%" style="stop-color:#c084fc" />
      <stop offset="40%" style="stop-color:#818cf8" />
      <stop offset="60%" style="stop-color:#38bdf8" />
      <stop offset="80%" style="stop-color:#34d399" />
      <stop offset="100%" style="stop-color:#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">The History of AI</text>

  <!-- Main timeline line -->
  <line x1="50" y1="160" x2="850" y2="160" stroke="url(#lineGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- 1950s - Birth -->
  <circle cx="100" cy="160" r="16" fill="#f472b6"/>
  <circle cx="100" cy="160" r="10" fill="#1e1b4b"/>
  <text x="100" y="200" text-anchor="middle" fill="#f472b6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1950s</text>
  <text x="100" y="220" text-anchor="middle" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11">Birth of AI</text>
  <text x="100" y="110" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">Dartmouth</text>
  <text x="100" y="125" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">Conference</text>

  <!-- 1960s-70s - First Winter -->
  <circle cx="230" cy="160" r="16" fill="#c084fc"/>
  <circle cx="230" cy="160" r="10" fill="#1e1b4b"/>
  <text x="230" y="200" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1970s</text>
  <text x="230" y="220" text-anchor="middle" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11">First AI Winter</text>
  <text x="230" y="110" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">ELIZA</text>
  <text x="230" y="125" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">chatbot</text>

  <!-- Snowflake icon for winter -->
  <text x="230" y="85" text-anchor="middle" fill="#c084fc" font-size="16">❄️</text>

  <!-- 1980s - Expert Systems -->
  <circle cx="360" cy="160" r="16" fill="#818cf8"/>
  <circle cx="360" cy="160" r="10" fill="#1e1b4b"/>
  <text x="360" y="200" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1980s</text>
  <text x="360" y="220" text-anchor="middle" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11">Expert Systems</text>
  <text x="360" y="110" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">Business</text>
  <text x="360" y="125" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">applications</text>

  <!-- 1990s - Machine Learning -->
  <circle cx="490" cy="160" r="16" fill="#38bdf8"/>
  <circle cx="490" cy="160" r="10" fill="#1e1b4b"/>
  <text x="490" y="200" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1990s</text>
  <text x="490" y="220" text-anchor="middle" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11">Machine Learning</text>
  <text x="490" y="110" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">Deep Blue</text>
  <text x="490" y="125" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">beats Kasparov</text>

  <!-- Chess icon -->
  <text x="490" y="85" text-anchor="middle" fill="#38bdf8" font-size="16">♟️</text>

  <!-- 2010s - Deep Learning -->
  <circle cx="620" cy="160" r="16" fill="#34d399"/>
  <circle cx="620" cy="160" r="10" fill="#1e1b4b"/>
  <text x="620" y="200" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2010s</text>
  <text x="620" y="220" text-anchor="middle" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11">Deep Learning</text>
  <text x="620" y="110" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">AlphaGo,</text>
  <text x="620" y="125" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">Alexa, Siri</text>

  <!-- Brain icon -->
  <text x="620" y="85" text-anchor="middle" fill="#34d399" font-size="16">🧠</text>

  <!-- 2020s - AI Mainstream -->
  <circle cx="750" cy="160" r="20" fill="#fbbf24"/>
  <circle cx="750" cy="160" r="12" fill="#1e1b4b"/>
  <text x="750" y="200" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2020s</text>
  <text x="750" y="220" text-anchor="middle" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11">AI for Everyone</text>
  <text x="750" y="110" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">ChatGPT,</text>
  <text x="750" y="125" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10">DALL-E</text>

  <!-- Rocket icon -->
  <text x="750" y="85" text-anchor="middle" fill="#fbbf24" font-size="16">🚀</text>

  <!-- Arrow at the end -->
  <polygon points="850,160 835,150 835,170" fill="#fbbf24"/>

  <!-- Future label -->
  <text x="850" y="200" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-style="italic">Future?</text>

  <!-- Legend at bottom -->
  <rect x="50" y="260" width="800" height="45" fill="rgba(255,255,255,0.05)" rx="8"/>
  <circle cx="100" cy="282" r="6" fill="#f472b6"/>
  <text x="115" y="286" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10">Founding Era</text>

  <circle cx="230" cy="282" r="6" fill="#c084fc"/>
  <text x="245" y="286" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10">AI Winters</text>

  <circle cx="340" cy="282" r="6" fill="#818cf8"/>
  <text x="355" y="286" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10">Practical Apps</text>

  <circle cx="470" cy="282" r="6" fill="#38bdf8"/>
  <text x="485" y="286" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10">Learning Era</text>

  <circle cx="590" cy="282" r="6" fill="#34d399"/>
  <text x="605" y="286" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10">Revolution</text>

  <circle cx="710" cy="282" r="6" fill="#fbbf24"/>
  <text x="725" y="286" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10">Mainstream</text>
</svg>